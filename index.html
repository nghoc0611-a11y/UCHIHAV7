<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=yes">
  <title>UCHIHA V7 · NTH TEAM · Bảo trì</title>
  <style>
    /* ===== reset & base ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #0a0a12;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: env(safe-area-inset-top, 24px);
      padding-bottom: env(safe-area-inset-bottom, 24px);
      /* UCHIHA + NTH: đỏ huyết + xanh dương + tím */
      background: radial-gradient(circle at 20% 25%, #1a0a12, #05030a 80%);
      position: relative;
      overflow-x: hidden;
    }

    /* ===== moving gradient (đỏ - tím - xanh) ===== */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse at 25% 30%, rgba(180, 20, 50, 0.25) 0%, transparent 50%),
                  radial-gradient(ellipse at 75% 60%, rgba(100, 40, 220, 0.20) 0%, transparent 50%),
                  radial-gradient(ellipse at 50% 80%, rgba(0, 150, 255, 0.12) 0%, transparent 45%);
      background-blend-mode: soft-light, screen, normal;
      animation: gradientShift 16s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes gradientShift {
      0% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
      100% { opacity: 0.7; transform: scale(0.98); }
    }

    /* ===== particles (đỏ - tím - xanh) ===== */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      filter: blur(2px);
      animation: floatParticle 20s infinite alternate ease-in-out;
    }

    .particle:nth-child(1) { left: 10%; top: 20%; animation-duration: 18s; opacity: 0.7; width: 7px; height: 7px; background: rgba(255, 80, 100, 0.6); box-shadow: 0 0 20px rgba(255, 60, 80, 0.3); }
    .particle:nth-child(2) { left: 88%; top: 15%; animation-duration: 24s; opacity: 0.5; background: rgba(160, 80, 255, 0.5); box-shadow: 0 0 20px rgba(140, 60, 255, 0.3); }
    .particle:nth-child(3) { left: 45%; top: 85%; animation-duration: 22s; opacity: 0.6; width: 9px; height: 9px; background: rgba(60, 200, 255, 0.4); box-shadow: 0 0 20px rgba(40, 180, 255, 0.3); }
    .particle:nth-child(4) { left: 20%; top: 70%; animation-duration: 28s; opacity: 0.4; background: rgba(200, 50, 80, 0.5); box-shadow: 0 0 20px rgba(200, 40, 70, 0.3); }
    .particle:nth-child(5) { left: 75%; top: 35%; animation-duration: 19s; opacity: 0.7; width: 6px; height: 6px; background: rgba(40, 180, 240, 0.6); box-shadow: 0 0 20px rgba(30, 160, 255, 0.3); }
    .particle:nth-child(6) { left: 50%; top: 8%; animation-duration: 26s; opacity: 0.5; background: rgba(180, 80, 255, 0.4); box-shadow: 0 0 20px rgba(160, 60, 255, 0.3); }
    .particle:nth-child(7) { left: 6%; top: 55%; animation-duration: 30s; opacity: 0.3; width: 12px; height: 12px; background: rgba(255, 50, 70, 0.3); box-shadow: 0 0 20px rgba(255, 40, 60, 0.2); }
    .particle:nth-child(8) { left: 92%; top: 78%; animation-duration: 25s; opacity: 0.4; background: rgba(140, 60, 255, 0.4); box-shadow: 0 0 20px rgba(120, 50, 255, 0.3); }

    @keyframes floatParticle {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(25px, -30px) scale(1.2); }
      66% { transform: translate(-18px, 20px) scale(0.8); }
      100% { transform: translate(12px, -12px) scale(1.1); }
    }

    /* ===== main glass card ===== */
    .announcement-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      animation: fadeIn 1.4s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(18px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== GLASS CARD · UCHIHA + NTH ===== */
    .glass-card {
      background: rgba(12, 6, 20, 0.55);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border-radius: 56px;
      padding: 44px 38px 34px;
      border: 1px solid rgba(200, 80, 120, 0.20);
      box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.9),
                  0 0 0 1px rgba(200, 60, 100, 0.10) inset,
                  0 0 70px rgba(180, 30, 80, 0.15);
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    /* ===== light beam (đỏ - tím - xanh) ===== */
    .glass-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg at 50% 50%, 
        rgba(200, 40, 70, 0.04), 
        rgba(120, 60, 255, 0.05), 
        rgba(0, 200, 255, 0.03), 
        rgba(200, 40, 80, 0.06), 
        rgba(200, 40, 70, 0.04));
      animation: rotateBeam 22s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes rotateBeam {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ===== border glow ===== */
    .glass-card::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 58px;
      padding: 2px;
      background: linear-gradient(135deg, rgba(220, 60, 100, 0.30), rgba(140, 60, 255, 0.25), rgba(0, 200, 255, 0.30));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 1;
      animation: borderGlow 8s ease-in-out infinite alternate;
    }

    @keyframes borderGlow {
      0% { opacity: 0.3; }
      50% { opacity: 0.9; }
      100% { opacity: 0.4; }
    }

    /* ===== card content ===== */
    .card-content {
      position: relative;
      z-index: 5;
      color: #f0e8f0;
    }

    /* ===== HEADER ===== */
    .header {
      text-align: center;
      margin-bottom: 24px;
      letter-spacing: 0.02em;
    }

    .main-title {
      font-size: clamp(3.0rem, 13vw, 5.0rem);
      font-weight: 800;
      background: linear-gradient(135deg, #ff7a9e, #d46a9e, #a78bfa, #60d0ff, #ff7a9e);
      background-size: 350% 350%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradientText 7s ease-in-out infinite alternate;
      text-shadow: 0 0 50px rgba(200, 60, 120, 0.25);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    @keyframes gradientText {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .sub-headline {
      font-size: clamp(0.7rem, 2.0vw, 0.9rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(210, 180, 210, 0.7);
      margin-top: 8px;
      font-weight: 400;
      text-shadow: 0 0 20px rgba(200, 80, 150, 0.15);
      border-top: 1px solid rgba(200, 120, 170, 0.12);
      padding-top: 12px;
      display: inline-block;
    }

    /* ===== announcement block ===== */
    .announce-block {
      margin: 24px 0 16px;
      padding: 0 4px;
    }

    .block-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: #e8d0e0;
      margin-bottom: 16px;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
      border-left: 4px solid rgba(200, 80, 150, 0.5);
      padding-left: 18px;
      text-shadow: 0 0 18px rgba(200, 60, 120, 0.15);
    }

    .block-content {
      font-size: clamp(1.05rem, 2.4vw, 1.25rem);
      line-height: 1.8;
      color: rgba(235, 220, 240, 0.92);
      padding-left: 10px;
      font-weight: 350;
      letter-spacing: 0.01em;
    }

    .block-content p {
      margin-bottom: 14px;
    }

    .highlight-line {
      display: block;
      font-weight: 600;
      background: linear-gradient(135deg, #ff8aa8, #c084fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-size: clamp(1.1rem, 2.6vw, 1.35rem);
      padding: 8px 0 4px;
      text-shadow: 0 0 30px rgba(200, 80, 150, 0.2);
      letter-spacing: -0.01em;
    }

    .highlight-line.contact {
      background: linear-gradient(135deg, #fcd34d, #f59e0b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 700;
      text-shadow: 0 0 35px rgba(245, 158, 11, 0.2);
    }

    .highlight-line.blue {
      background: linear-gradient(135deg, #7ac4ff, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* ===== FOOTER ===== */
    .footer {
      margin-top: 32px;
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: rgba(200, 170, 200, 0.3);
      border-top: 1px solid rgba(200, 120, 170, 0.06);
      padding-top: 24px;
      text-transform: uppercase;
      font-weight: 400;
    }

    .footer span {
      display: inline-block;
      margin: 0 6px;
    }

    /* ===== responsive ===== */
    @media (max-width: 640px) {
      body { padding: 16px; }
      .glass-card {
        padding: 30px 18px 24px;
        border-radius: 40px;
      }
      .block-title {
        font-size: 1.15rem;
        padding-left: 14px;
      }
      .block-content {
        font-size: 0.98rem;
        padding-left: 6px;
      }
      .highlight-line {
        font-size: 1.02rem;
      }
      .footer {
        font-size: 0.6rem;
        padding-top: 20px;
      }
    }

    @media (max-width: 420px) {
      .glass-card {
        padding: 24px 14px 20px;
        border-radius: 32px;
      }
      .main-title {
        font-size: 2.4rem;
      }
      .block-content {
        font-size: 0.92rem;
      }
    }

    @media (min-width: 1024px) {
      .glass-card {
        padding: 52px 48px 38px;
      }
    }

    /* ===== safe area ===== */
    @supports (padding: max(0px)) {
      .announcement-wrapper {
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
    }

    /* ===== no interactions ===== */
    .glass-card, .glass-card * {
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }
    .glass-card .block-content {
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- particles -->
  <div class="particles" aria-hidden="true">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <!-- MAIN CARD -->
  <div class="announcement-wrapper">
    <div class="glass-card">
      <div class="card-content">

        <!-- HEADER: UCHIHA V7 + NTH TEAM -->
        <div class="header">
          <div class="main-title">⚡ UCHIHA V7</div>
          <div class="sub-headline">NTH TEAM · OFFICIAL MAINTENANCE</div>
        </div>

        <!-- NỘI DUNG THÔNG BÁO -->
        <div class="announce-block">
          <div class="block-title">📢 TỪ ADMIN TIẾN HỌC</div>
          <div class="block-content">
            <p>
              <span class="highlight-line">🔧 BẢO TRÌ ĐỂ NÂNG CẤP HỆ THỐNG VÀ TỐI ƯU CHỨC NĂNG</span>
            </p>
            <p>
              <span class="highlight-line blue">✅ CÁC TÀI KHOẢN ĐÃ KÍCH HOẠT SẼ VẪN CÓ TÁC DỤNG KHI CHƠI GAME</span>
            </p>
            <p style="margin-top: 10px; font-weight: 400; color: rgba(230, 215, 240, 0.85);">
              Trân trọng,<br>
              <span style="font-weight: 600; color: #d4b8e0; letter-spacing: 0.05em;">ĐỘI NGŨ NTH TEAM GROUP!!!</span>
            </p>
          </div>
        </div>

        <!-- FOOTER -->
        <div class="footer">
          <span>© 2026 UCHIHA · NTH TEAM</span>
          <span>·</span>
          <span>ALL RIGHTS RESERVED</span>
        </div>

      </div> <!-- /card-content -->
    </div> <!-- /glass-card -->
  </div> <!-- /announcement-wrapper -->
</body>
</html>
